<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NapCat WebUI</title>
  <meta key="title" content="NapCat WebUI" property="og:title"/>
  <meta content="NapCat WebUI，基于React+tailwind+NextUI" property="og:description"/>
  <meta content="NapCat WebUI，基于React+tailwind+NextUI" name="description"/>
  <meta key="viewport"
        content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
        name="viewport"/>
  <link href="/favicon.ico" rel="icon"/>
  <!-- Live2D 插件先加载：initApp() 在 window.load 时扫描下方静态容器，与 React 渲染时序完全解耦 -->
  <script src="https://live2d.muqingxi.com/Core/live2dcubismcore.js"></script>
  <script type="module" src="https://live2d.muqingxi.com/live2dplugin.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Live2D 静态容器：HTML 解析即存在，window.load 时插件必然能扫描到（尺寸/位置由 live2D.tsx 控制） -->
<div id="live2d-root"
     style="position: fixed; right: 20px; bottom: 20px; width: 300px; height: 400px; z-index: 9999; touch-action: none; user-select: none; -webkit-user-select: none;">
  <!-- 模型裁剪容器（overflow:hidden 仅作用于模型）；回复气泡位于它上方，不被裁剪 -->
  <div id="live2d-wrapper"
       style="position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 24px;">
    <div class="live2d-config"
         style="width: 100%; height: 100%;"
         data-cubism-model="https://live2d.muqingxi.com/Resources/Elysia"
         data-model-path="https://img.bj0yx.com/"
         data-show-background="false"
         data-shader-path="https://live2d.muqingxi.com/Framework/Shaders/WebGL/">
    </div>
  </div>
</div>

<script type="module" src="/src/main.tsx"></script>
</body>

</html>
